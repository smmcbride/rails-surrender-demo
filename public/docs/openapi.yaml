openapi: 3.1.0
info:
  title: Surrender Demo API
  version: 1.0.0
  description: |
    A small Rails API that shows [rails-surrender](https://github.com/smmcbride/rails-surrender) in use. Clients shape
    each response with query parameters: they pick the attributes and nested associations they want, and filter,
    sort, paginate or count the results.

    **To start**, press **Authorize** and enter a user id, such as `1`. The demo has no login: the id is sent as the
    `Authorization` header and the API acts as that user. A user can read only their own company, its users, and the
    work orders and activities those users created.

    Each query parameter has a list of examples to choose from under **Try it out**. The seed data is generated by
    Faker, so names and ids differ between installs.

    | Model       | Rendered by default                                  | Available with `include`                  |
    |-------------|------------------------------------------------------|-------------------------------------------|
    | `Company`   | `id`, `name`                                         | `created_at`, `updated_at`, `users`       |
    | `User`      | `id`, `name`, `active`                               | `created_at`, `updated_at`, `work_orders` |
    | `WorkOrder` | `id`, `title`, `description`, `status`, `activities` | `created_at`, `updated_at`, `user`        |
    | `Activity`  | `id`, `action`, `creator`                            | `user_id`, `created_at`, `updated_at`     |
servers:
  - url: /
security:
  - userId: []

tags:
  - name: Company
  - name: Users
  - name: Work orders

paths:
  /company:
    get:
      tags: [Company]
      summary: The current user's company
      parameters:
        - name: include
          in: query
          description: Attributes and associations to render on top of the defaults. Brackets shape nested resources.
          schema: { type: string }
          examples:
            none: { summary: Defaults only, value: '' }
            timestamps: { summary: Timestamps, value: 'created_at,updated_at' }
            users: { summary: The company's users, value: users }
            users_with_work_orders:
              summary: Users and their work orders
              value: 'users:[work_orders]'
        - name: exclude
          in: query
          description: Attributes and associations to leave out of the defaults.
          schema: { type: string }
          examples:
            none: { summary: Nothing excluded, value: '' }
            id: { summary: Drop the id, value: id }
      responses:
        '200':
          description: The company
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }

  /users:
    get:
      tags: [Users]
      summary: Users in the current company
      parameters:
        - name: include
          in: query
          description: Attributes and associations to render on top of the defaults. Brackets shape nested resources.
          schema: { type: string }
          examples:
            none: { summary: Defaults only, value: '' }
            timestamps: { summary: Timestamps, value: 'created_at,updated_at' }
            work_orders: { summary: Each user's work orders, value: work_orders }
            work_orders_shaped:
              summary: Work orders with created_at, and created_at on their activities
              value: 'work_orders:[created_at,activities:[created_at]]'
            unavailable:
              summary: Unavailable (400 Bad Request)
              value: company
        - name: exclude
          in: query
          description: Attributes and associations to leave out of the defaults.
          schema: { type: string }
          examples:
            none: { summary: Nothing excluded, value: '' }
            active: { summary: Drop active, value: active }
        - name: filter
          in: query
          description: |
            Comma-separated `column:value` pairs. Every column can be filtered for equality. Timestamps also have
            `_before`, `_after`, `_to` and `_from` filters, whose values must be quoted.
          schema: { type: string }
          examples:
            none: { summary: No filter, value: '' }
            active: { summary: Active users, value: 'active:true' }
            inactive: { summary: Inactive users, value: 'active:false' }
            created_this_year:
              summary: Created since the start of 2026
              value: "created_from:'2026-01-01'"
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/ids'
      responses:
        '200':
          description: A page of users, or their count or ids
          headers:
            X-Pagination: { $ref: '#/components/headers/X-Pagination' }
            X-Sort: { $ref: '#/components/headers/X-Sort' }
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/User' }
                  - $ref: '#/components/schemas/Count'
                  - $ref: '#/components/schemas/Ids'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }

  /users/{id}:
    get:
      tags: [Users]
      summary: One user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          examples:
            same_company: { summary: A user in company 1, value: 3 }
            other_company: { summary: A user in company 2 (403 for users of company 1), value: 20 }
            missing: { summary: No such user (404), value: 9999 }
        - name: include
          in: query
          description: Attributes and associations to render on top of the defaults. Brackets shape nested resources.
          schema: { type: string }
          examples:
            none: { summary: Defaults only, value: '' }
            timestamps: { summary: Timestamps, value: 'created_at,updated_at' }
            work_orders: { summary: The user's work orders, value: work_orders }
            work_orders_shaped:
              summary: Work orders with created_at
              value: 'work_orders:[created_at]'
        - name: exclude
          in: query
          description: Attributes and associations to leave out of the defaults.
          schema: { type: string }
          examples:
            none: { summary: Nothing excluded, value: '' }
            work_order_activities:
              summary: Drop activities from included work orders
              value: 'work_orders:[activities]'
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /work_orders:
    get:
      tags: [Work orders]
      summary: Work orders in the current company
      parameters:
        - name: include
          in: query
          description: Attributes and associations to render on top of the defaults. Brackets shape nested resources.
          schema: { type: string }
          examples:
            none: { summary: Defaults only, value: '' }
            timestamps: { summary: Timestamps, value: 'created_at,updated_at' }
            user: { summary: The user who raised it, value: user }
            activity_timestamps:
              summary: created_at on each activity
              value: 'activities:[created_at]'
        - name: exclude
          in: query
          description: Attributes and associations to leave out of the defaults.
          schema: { type: string }
          examples:
            none: { summary: Nothing excluded, value: '' }
            activities: { summary: Drop activities, value: activities }
            description: { summary: Drop description, value: description }
        - name: filter
          in: query
          description: |
            Comma-separated `column:value` pairs. Every column can be filtered for equality. Timestamps also have
            `_before`, `_after`, `_to` and `_from` filters, whose values must be quoted.
          schema: { type: string }
          examples:
            none: { summary: No filter, value: '' }
            open: { summary: Open, value: 'status:open' }
            pending: { summary: Pending, value: 'status:pending' }
            closed: { summary: Closed, value: 'status:closed' }
            by_user: { summary: Raised by user 1, value: 'user_id:1' }
            open_this_year:
              summary: Open and created since the start of 2026
              value: "status:open,created_after:'2026-01-01'"
        - name: sort
          in: query
          description: An attribute, or `association.attribute`, to sort by. A leading `-` sorts in reverse.
          schema: { type: string }
          examples:
            none: { summary: Unsorted, value: '' }
            title: { summary: Title, value: title }
            newest: { summary: Newest first, value: '-created_at' }
            user_name: { summary: Name of the user who raised it, value: user.name }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per'
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/ids'
      responses:
        '200':
          description: A page of work orders, or their count or ids
          headers:
            X-Pagination: { $ref: '#/components/headers/X-Pagination' }
            X-Sort: { $ref: '#/components/headers/X-Sort' }
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/WorkOrder' }
                  - $ref: '#/components/schemas/Count'
                  - $ref: '#/components/schemas/Ids'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }

  /work_orders/{id}:
    get:
      tags: [Work orders]
      summary: One work order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          examples:
            same_company: { summary: A work order in company 1, value: 3 }
            missing: { summary: No such work order (404), value: 9999 }
        - name: include
          in: query
          description: Attributes and associations to render on top of the defaults. Brackets shape nested resources.
          schema: { type: string }
          examples:
            none: { summary: Defaults only, value: '' }
            created_at_and_user: { summary: created_at and the user who raised it, value: 'created_at,user' }
            user_created_at:
              summary: The user, with their created_at
              value: 'user:[created_at]'
        - name: exclude
          in: query
          description: Attributes and associations to leave out of the defaults.
          schema: { type: string }
          examples:
            none: { summary: Nothing excluded, value: '' }
            activities: { summary: Drop activities, value: activities }
            activity_creator:
              summary: Drop the creator from each activity
              value: 'activities:[creator]'
      responses:
        '200':
          description: The work order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    userId:
      type: apiKey
      in: header
      name: Authorization
      description: |
        The id of the user to act as, such as `1`. The demo sends it as the `Authorization` header in place of a
        login. This keeps the demo simple but is not a pattern to copy.

  parameters:
    sort:
      name: sort
      in: query
      description: An attribute to sort by. A leading `-` sorts in reverse. The response echoes it in `X-Sort`.
      schema: { type: string }
      examples:
        none: { summary: Unsorted, value: '' }
        name: { summary: Name, value: name }
        name_reversed: { summary: Name, reversed, value: '-name' }
        newest: { summary: Newest first, value: '-created_at' }
    page:
      name: page
      in: query
      description: The page to return, starting at 1. `X-Pagination` describes the page.
      schema: { type: integer, minimum: 1 }
    per:
      name: per
      in: query
      description: Results per page. Defaults to 50.
      schema: { type: integer, minimum: 1 }
    count:
      name: count
      in: query
      description: |
        Return how many records match the filters, across every page, instead of the records. Surrender checks only
        that the parameter is present, so any value works.
      schema: { type: boolean }
    ids:
      name: ids
      in: query
      description: |
        Return the ids of the matching records instead of the records. Surrender checks only that the parameter is
        present, so any value works.
      schema: { type: boolean }

  headers:
    X-Pagination:
      description: The page returned, as JSON.
      schema: { type: string }
      example: '{"total":14,"page_total":2,"page":1,"previous_page":null,"next_page":2,"last_page":7,"per_page":2,"offset":0}'
    X-Sort:
      description: The sort applied, echoed from the `sort` parameter.
      schema: { type: string }
      example: '-name'

  responses:
    BadRequest:
      description: A query parameter is malformed or asks for something the model does not make available.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: '[:company] is not a valid include parameter.' }
    NotAuthenticated:
      description: No user id was given, or no user has that id. Press Authorize to set one.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: User is not authenticated }
    Forbidden:
      description: The record belongs to another company.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: User is not authorized }
    NotFound:
      description: No record has that id.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "Couldn't find User with 'id'=\"9999\"" }

  # Properties marked "include" render only when requested; the others render by default unless excluded.
  schemas:
    Company:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        created_at: { type: string, format: date-time, description: include }
        updated_at: { type: string, format: date-time, description: include }
        users: { type: array, items: { $ref: '#/components/schemas/User' }, description: include }
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time, description: include }
        updated_at: { type: string, format: date-time, description: include }
        work_orders: { type: array, items: { $ref: '#/components/schemas/WorkOrder' }, description: include }
    WorkOrder:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [open, pending, closed] }
        activities: { type: array, items: { $ref: '#/components/schemas/Activity' } }
        created_at: { type: string, format: date-time, description: include }
        updated_at: { type: string, format: date-time, description: include }
        user: { $ref: '#/components/schemas/User', description: include }
    Activity:
      type: object
      properties:
        id: { type: integer }
        action: { type: string }
        creator: { $ref: '#/components/schemas/User' }
        user_id: { type: integer, description: include }
        created_at: { type: string, format: date-time, description: include }
        updated_at: { type: string, format: date-time, description: include }
    Count:
      type: object
      properties:
        count: { type: integer }
      example: { count: 18 }
    Ids:
      type: object
      properties:
        ids: { type: array, items: { type: integer } }
      example: { ids: [5, 7, 8] }
    Error:
      type: object
      properties:
        error: { type: string }
